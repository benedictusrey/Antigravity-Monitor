<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'none'; img-src {{cspSource}} data:; style-src {{cspSource}}; script-src 'nonce-{{nonce}}';"
  />
  <link rel="stylesheet" href="{{cssUri}}" />
  <title>Antigravity Monitor</title>
</head>
<body data-host="{{host}}">
  <div class="shell">
    <header class="topbar">
      <div class="identity">
        <div class="brand">
          <svg class="brand__mark" viewBox="0 0 512 512" width="28" height="28" aria-hidden="true">
            <rect x="12" y="12" width="488" height="488" rx="104" fill="#181c24"/>
            <path d="m88 366 114-212q23-38 46 0l101 175 30-49 45 48h-32l-43 75-124-215-84 178z" fill="#f1f4f9"/>
            <rect x="184" y="338" width="30" height="40" rx="7" fill="#3b9eff"/>
            <rect x="226" y="314" width="30" height="64" rx="7" fill="#3b9eff"/>
            <rect x="268" y="288" width="30" height="90" rx="7" fill="#3b9eff"/>
          </svg>
          <div class="brand__text">
            <h1>Antigravity Monitor</h1>
            <p id="subtitle" class="subtitle">Connecting to Antigravity&hellip;</p>
          </div>
        </div>
      </div>
      <div class="topbar-actions">
        <button id="btn-follow" class="chip chip--plain chip--action" type="button" hidden title="Stop pinning and follow the active thread">Pinned &middot; Auto-follow</button>
        <span id="status-chip" class="chip chip--neutral" aria-live="polite">Starting</span>
        <button id="btn-copy" class="btn btn--ghost" type="button" hidden title="Copy current session summary">Copy</button>
        <button id="btn-theme" class="btn btn--ghost btn--theme" type="button" aria-label="Switch theme" title="Toggle Dark / Light theme">
          <svg class="btn__icon theme-icon theme-icon--sun" viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="8" cy="8" r="3" />
            <path d="M8 1.5v1.6M8 12.9v1.6M1.5 8h1.6M12.9 8h1.6M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M12.6 3.4l-1.1 1.1M4.5 11.5l-1.1 1.1" />
          </svg>
          <svg class="btn__icon theme-icon theme-icon--moon" viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden>
            <path d="M13.2 9.6A5.6 5.6 0 0 1 6.4 2.8a5.6 5.6 0 1 0 6.8 6.8Z" />
          </svg>
        </button>
        <button id="btn-refresh" class="btn btn--ghost" type="button">
          <svg class="btn__icon" viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M13.5 8a5.5 5.5 0 1 1-1.45-3.73" />
            <path d="M13.5 2.5v2.75H10.75" />
          </svg>
          <span class="btn__label">Refresh</span>
        </button>
        <button id="btn-close-panel" class="btn btn--ghost btn--close" type="button" hidden aria-label="Close panel" title="Hide floating panel">
          <svg class="btn__icon" viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
            <path d="M4 4l8 8M12 4l-8 8" />
          </svg>
        </button>
      </div>
    </header>

    <nav class="tabs" role="tablist" aria-label="Dashboard sections">
      <button class="tab" role="tab" data-tab="overview" id="tab-overview" aria-selected="true" aria-controls="pane-overview">Overview</button>
      <button class="tab" role="tab" data-tab="sessions" id="tab-sessions" aria-selected="false" aria-controls="pane-sessions">Threads</button>
      <button class="tab" role="tab" data-tab="models" id="tab-models" aria-selected="false" aria-controls="pane-models">Models</button>
      <button class="tab" role="tab" data-tab="settings" id="tab-settings" aria-selected="false" aria-controls="pane-settings">Settings</button>
      <span class="tabs__indicator" id="tab-indicator" aria-hidden="true"></span>
    </nav>

    <main class="content">
      <section id="pane-overview" class="pane" role="tabpanel" aria-labelledby="tab-overview" data-pane="overview"></section>
      <section id="pane-sessions" class="pane" role="tabpanel" aria-labelledby="tab-sessions" data-pane="sessions" hidden></section>
      <section id="pane-models" class="pane" role="tabpanel" aria-labelledby="tab-models" data-pane="models" hidden></section>
      <section id="pane-settings" class="pane" role="tabpanel" aria-labelledby="tab-settings" data-pane="settings" hidden></section>
    </main>

    <footer class="footer">
      <span id="footer-note">Readings come from the local Antigravity language server. Nothing leaves this machine.</span>
      <span class="footer__keys">1&ndash;4 tabs &middot; R refresh &middot; T theme</span>
    </footer>
  </div>

  <script nonce="{{nonce}}" src="{{jsUri}}"></script>
</body>
</html>
